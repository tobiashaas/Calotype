name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Validate contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install openapi-spec-validator check-jsonschema
      - name: Validate OpenAPI and JSON Schemas
        run: python scripts/validate_contracts.py

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff>=0.8
      - name: Lint
        run: |
          ruff check \
            libs/domain/src \
            libs/queue/src \
            libs/observability/src \
            libs/inference-pipeline/src \
            libs/edit-serializer/src \
            libs/culling/src \
            services/api/src \
            services/workers/feature_worker/src \
            services/workers/train_worker/src \
            services/workers/inference_worker/src \
            tools

  inference-pipeline:
    name: Inference pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "libs/inference-pipeline[dev]"
      - name: Test
        run: python -m pytest libs/inference-pipeline/tests/ -v

  edit-serializer:
    name: Edit serializer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "libs/edit-serializer[dev]"
      - name: Test
        run: python -m pytest libs/edit-serializer/tests/ -v

  culling:
    name: Culling library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "libs/culling[dev]"
      - name: Test
        run: python -m pytest libs/culling/tests/ -v

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e libs/domain -e libs/queue -e libs/observability -e libs/persistence
          pip install -e libs/inference-pipeline -e libs/edit-serializer
          pip install -e services/workers/train_worker pytest
      - name: Test
        run: python -m pytest services/workers/train_worker/tests/ -v

  bridge-core:
    name: Bridge core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/bridge
      # The Tauri crate needs WebKitGTK on Linux; the core is tested on its own.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p lrff-bridge-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p lrff-bridge-core

  lr-plugin:
    name: Lightroom plugin (Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT (Lua 5.1, like Lightroom)
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Test
        run: luajit apps/lr-plugin/tests/run.lua

  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e libs/domain
          pip install -e libs/queue
          pip install -e libs/observability
          pip install -e "libs/persistence" --no-deps
          pip install sqlalchemy>=2.0 pydantic>=2.10
          pip install -e "services/api[dev]"
      - name: Test
        run: python -m pytest services/api/tests/ -v
