name: Release

# Builds the desktop installers (Windows .exe/.msi, macOS .dmg, Linux .deb/.AppImage)
# and the Lightroom plugin zip.
#   - tag v*            → attached to a draft GitHub release
#   - manual run / PR   → uploaded as workflow artifacts only (no release)
# The installers are not code-signed yet: macOS Gatekeeper and Windows SmartScreen warn.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/bridge/src-tauri/**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/bridge

      - name: Install the Tauri CLI
        working-directory: apps/bridge
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/bridge
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Calotype ${{ github.ref_name }}"
          releaseBody: "Desktop installers and the Lightroom plugin. Not code-signed yet — see the README for the first start on macOS and Windows."
          releaseDraft: true
          prerelease: true

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}-${{ matrix.rust_targets || 'default' }}
          if-no-files-found: error
          path: |
            apps/bridge/target/**/bundle/nsis/*.exe
            apps/bridge/target/**/bundle/msi/*.msi
            apps/bridge/target/**/bundle/dmg/*.dmg
            apps/bridge/target/**/bundle/deb/*.deb
            apps/bridge/target/**/bundle/rpm/*.rpm
            apps/bridge/target/**/bundle/appimage/*.AppImage

  plugin:
    name: Lightroom plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the plugin
        working-directory: apps/lr-plugin
        run: zip -r "$GITHUB_WORKSPACE/Calotype.lrplugin.zip" Calotype.lrplugin
      - uses: actions/upload-artifact@v4
        with:
          name: lightroom-plugin
          path: Calotype.lrplugin.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "Calotype $GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" Calotype.lrplugin.zip --clobber
