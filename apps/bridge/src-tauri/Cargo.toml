[package]
name = "tarsier-bridge"
description = "Tarsier Bridge desktop app (Tauri shell around tarsier-bridge-core)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tarsier-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tarsier-bridge-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
