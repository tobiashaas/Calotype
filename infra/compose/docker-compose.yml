services:
  # Postgres with pgvector (image maintained by pgvector org)
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${LR_FF_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${LR_FF_POSTGRES_DB:-lrframeflow}
      POSTGRES_USER: ${LR_FF_POSTGRES_USER:-lrframeflow}
      POSTGRES_PASSWORD: ${LR_FF_POSTGRES_PASSWORD:-lrframeflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lrframeflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${LR_FF_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage. RustFS (Apache-2.0) replaces MinIO, which stopped
  # publishing community images in 2025. Variable names stay LR_FF_MINIO_* so existing
  # .env files keep working; any S3 endpoint works (S3_ENDPOINT).
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${LR_FF_MINIO_USER:-minio}
      RUSTFS_SECRET_KEY: ${LR_FF_MINIO_PASSWORD:-miniosecret_changeme}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${LR_FF_MINIO_PORT:-9000}:9000"
      - "${LR_FF_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3_data:/data

  # Workers run as local Python processes (not in compose for now).
  # When containerised, add HEALTHCHECK like:
  #   HEALTHCHECK --interval=30s --timeout=5s --retries=3 \
  #       CMD bash -c 'test $(( $(date +%s) - $(cat /tmp/lr_ff_feature_worker.heartbeat) )) -lt 60'

volumes:
  postgres_data:
  redis_data:
  s3_data:
