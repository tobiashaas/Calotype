[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calotype-inference-pipeline"
version = "0.1.0"
description = "Pure, injectable inference steps (no DB/Redis)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "opencv-python-headless>=4.8",  # Apache-2.0; YuNet face box for v2 features
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
