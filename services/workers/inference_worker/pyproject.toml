[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarsier-worker-inference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "tarsier-domain",
    "tarsier-persistence",
    "tarsier-queue",
    "tarsier-observability",
    "tarsier-inference-pipeline",
    "tarsier-edit-serializer",
    "boto3>=1.35",
]

[project.scripts]
tarsier-inference-worker = "tarsier_inference_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
