[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calotype-worker-inference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "calotype-domain",
    "calotype-persistence",
    "calotype-queue",
    "calotype-observability",
    "calotype-inference-pipeline",
    "calotype-edit-serializer",
    "boto3>=1.35",
]

[project.scripts]
calotype-inference-worker = "calotype_inference_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
